[package]
name = "netwatch-agent"
version = "0.6.1"
edition = "2021"
description = "Lightweight agent for NetWatch Cloud — collects network, system, and process metrics on Linux and macOS hosts and POSTs them to the hosted SaaS backend."
license = "MIT"
repository = "https://github.com/matthart1983/netwatch-agent"
homepage = "https://github.com/matthart1983/netwatch-agent"
readme = "README.md"

[dependencies]
netwatch-sdk = "0.4.1"   # 0.4.1 fixes a `DateTime - TimeDelta` overflow panic in proc_meta
# In-tree metadata-only classifier and source-side redaction.
netwatch-dpi = { path = "crates/netwatch-dpi" }
# Reverse-DNS (PTR) lookups for endpoint IPs the passive DNS map never named.
dns-lookup = "2"
tokio = { version = "1", features = ["rt", "rt-multi-thread", "time", "macros", "net", "sync", "io-util"] }
# WebSocket client for the outbound DPI metadata uplink (rustls — no system openssl).
tokio-tungstenite = { version = "0.24", features = ["rustls-tls-webpki-roots"] }
futures-util = "0.3"
ureq = { version = "2", features = ["json"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.8"
uuid = { version = "1", features = ["v4"] }
anyhow = "1"
chrono = { version = "0.4", features = ["serde"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
pcap = "2"
# OTLP metrics export (single-host, standards-native). HTTP/protobuf transport
# only — no gRPC/tonic — to keep the agent lean.
opentelemetry = { version = "0.27", features = ["metrics"] }
opentelemetry_sdk = { version = "0.27", features = ["metrics", "rt-tokio"] }
opentelemetry-otlp = { version = "0.27", default-features = false, features = ["metrics", "http-proto", "reqwest-blocking-client"] }

[dev-dependencies]
tempfile = "3"
proptest = "1"

[workspace]
members = ["crates/netwatch-dpi"]
resolver = "2"
