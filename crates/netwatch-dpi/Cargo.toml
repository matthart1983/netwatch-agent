[package]
name = "netwatch-dpi"
version = "0.0.1"
edition = "2021"
license = "MIT"
description = "Bounded metadata-only protocol classification for NetWatch capture"
publish = false

[dependencies]
serde = { version = "1", features = ["derive"] }
regex = "1"
tls-parser = "0.12"
ring = "0.17"

[dev-dependencies]
serde_json = "1"
proptest = "1"
